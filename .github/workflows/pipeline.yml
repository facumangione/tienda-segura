name: pipeline

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por SHA de commit: una etiqueta como v4 puede moverse,
      # un SHA no (ataque a la cadena de suministro)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Pruebas automáticas
      - run: npm ci
      - run: npm test

      # SCA: vulnerabilidades conocidas en las librerías
      - run: npm audit --audit-level=high

      # SAST: patrones peligrosos en el código
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config auto --error

      # Detección de secretos en el código y el historial
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
